name: PEV Eval Harness

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Compile
        run: npm run compile
      - name: Run unit tests
        run: npm test
      - name: Run eval harness
        run: npm run test:eval
        env:
          EVAL_THRESHOLD: '0.66'
